[project]
name = "omnistat"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "importlib-metadata",
    "Flask>=2.3.2",
    "prometheus_client>=0.17.0",
    "gunicorn>=21.2.0",
    "packaging>=24.1",
    "requests",
    "orjson",
    "bottleneck>=1.3.6",
    "matplotlib>=3.7.2",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "prometheus-api-client>=0.5.4",
    "reportlab>=4.0.5",
]

[project.scripts]
omnistat-monitor = "omnistat.node_monitoring:main"
omnistat-usermode = "omnistat.omni_util:main"
omnistat-annotate = "omnistat.annotate:main"
omnistat-query = "omnistat.query:main"
omnistat-rms-env = "omnistat.rms_env:main"
omnistat-standalone = "omnistat.standalone:main"
omnistat-inspect = "omnistat.inspect.cli:main"
omnistat-build-extras = "omnistat.build_extensions:main"

[build-system]
requires = ["scikit-build-core>=1.1"]
build-backend = "scikit_build_core.build"

# ---------------------------------------------------------------------------
# Build configuration
#
# By default nothing is compiled: the build produces a pure py3-none-any wheel
# and CMake is never invoked, so a plain install needs no compiler, no CMake and
# no ROCm. The optional native components are opted into per-install with
# config settings (or the equivalent environment variables):
#
#   pip install -C omnistat.counters=on  ...   # extension + libomnistat_count.so
#   pip install -C omnistat.tracing=on   ...   # libomnistat_trace.so
#   pip install -C omnistat.extras=on    ...   # both
#   OMNISTAT_COUNTERS=1 pip install ...        # same, without -C
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "1.1"
wheel.cmake = false
wheel.packages = ["omnistat"]
cmake.source-dir = "omnistat/rocprofiler-sdk"
# Exclude everything not tagged COMPONENT omnistat, so a dependency pulled in by
# FetchContent cannot leak its own install() rules into the wheel.
install.components = ["omnistat"]
sdist.exclude = [".github", "docker", "grafana", "misc", "test"]

# Version comes from the top-level VERSION file.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^\s*v?(?P<value>[^\s]+)\s*$'

[tool.scikit-build.config-setting."omnistat.counters"]
help = "Build hardware-counter support: the rocprofiler-sdk Python extension and libomnistat_count.so (default: off)"
type = "bool"
default = false
env = "OMNISTAT_COUNTERS"

[tool.scikit-build.config-setting."omnistat.tracing"]
help = "Build kernel-tracing support: libomnistat_trace.so (default: off; downloads cpp-httplib at configure time)"
type = "bool"
default = false
env = "OMNISTAT_TRACING"

[tool.scikit-build.config-setting."omnistat.extras"]
help = "Build every optional component; equivalent to omnistat.counters=on plus omnistat.tracing=on"
type = "bool"
default = false
env = "OMNISTAT_EXTRAS"

# Any capability turns the build into a real CMake build.
[[tool.scikit-build.overrides]]
if.any.config-setting."omnistat.counters" = true
if.any.config-setting."omnistat.tracing" = true
if.any.config-setting."omnistat.extras" = true
wheel.cmake = true

# Counters: the importable module plus the counter-enablement library.
# inherit=append on both tables so enabling several capabilities accumulates
# their defines instead of the last override replacing the earlier ones.
[[tool.scikit-build.overrides]]
if.any.config-setting."omnistat.counters" = true
if.any.config-setting."omnistat.extras" = true
inherit.cmake.define = "append"
inherit.build.requires = "append"
cmake.define.BUILD_PYTHON_EXTENSION = "ON"
cmake.define.BUILD_COUNT_LIB = "ON"
build.requires = ["nanobind<3.0"]

# Tracing: the kernel-tracing library only. Never needs nanobind.
[[tool.scikit-build.overrides]]
if.any.config-setting."omnistat.tracing" = true
if.any.config-setting."omnistat.extras" = true
inherit.cmake.define = "append"
cmake.define.BUILD_KERNEL_TRACE_LIB = "ON"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning::", # ignore third-party deprecation warnings
    "default::DeprecationWarning:omnistat.*:",
]
markers = [
    "rocprofiler: requires rocprofiler SDK libraries (ROCP_TOOL_LIBRARIES)",
    "tsdb: requires VictoriaMetrics or Prometheus TSDB",
    "docker: requires Docker and containerized SLURM cluster",
]

[tool.black]
line-length = 120
include = '\.py$'

[tool.isort]
profile = "black"
src_paths = ["omnistat", "test"]
known_local_folder = ["omnistat", "test"]

[tool.coverage.run]
source = ["omnistat"]
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
include = ["omnistat/collector_*.py"]
omit = ["omnistat/collector_smi_process.py", "omnistat/collector_rocprofiler.py"]
