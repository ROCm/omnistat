name: GPU collectors

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours

  pull_request:
    branches: [ main, dev ]

  push:
    branches: [dev, coverage]

jobs:
  gpu-collectors:
    defaults:
      run:
        shell: bash --login {0}
    runs-on: [self-hosted, instinct]
    strategy:
      matrix:
        hardware: [mi210, mi300]
      fail-fast: false
    steps:
      - name: Setup hardware-specific run details
        run: |
           if [ ${{ matrix.hardware }} == "mi210" ];then
              echo "CI_QUEUE=devel" >> $GITHUB_ENV
           elif [ ${{ matrix.hardware }} == "mi300" ];then
              echo "CI_QUEUE=mi3001x" >> $GITHUB_ENV
           else
              echo "Unsupported hardware"
              exit 1
           fi
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create virtual environment
        run: |
          python -m venv omnistat_venv
          source omnistat_venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test/requirements.txt
          pip install nanobind
          cmake -S rocprofiler-sdk/ -B build/
          cmake --build build/
          cmake --install build/ --prefix .

      - name: Build kernel trace library
        run: |
          cmake -B build -S rocprofiler-sdk -DBUILD_KERNEL_TRACE_LIB=ON
          cmake --build build

      - name: Build test workloads
        run: make -C test/workloads OFFLOAD_ARCH="gfx90a gfx942"

      - name: Collector tests
        env:
          ROCP_TOOL_LIBRARIES: ${{ github.workspace }}/build/libomnistat_trace.so
          # Workaround to make sure counters work when tracing is also enabled
          HSA_TOOLS_ROCPROFILER_V1_TOOLS: 1
        run: |
          source omnistat_venv/bin/activate
          srun -N 1 -J omnistat -p $CI_QUEUE -t 00:10:00 \
            pytest -v --cov=omnistat --cov-report=xml --junitxml=results.xml test/test_collectors.py test/test_endpoint_collectors.py test/test_external_collector.py test/test_pm_counters.py  test/test_rms.py

##       - name: Test Report
##         uses: dorny/test-reporter@v2
##         if: ${{ !cancelled() }}
##         with:
##           name: GPU Collectors
##           reporter: jest-junit
##           path: results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          include_passed: 'true'
          report_paths: 'results.xml'
          check_name: "Collector Tests (${{ matrix.hardware }})"
          comment: 'true'

      - name: Generate Coverage Summary
        if: ${{ !cancelled() }}
        run: |
          source omnistat_venv/bin/activate
          coverage report
          TOTAL=$(coverage report --format=total)
          echo "$TOTAL" > coverage-total.txt
          echo "**Coverage (${{ matrix.hardware }}):** ${TOTAL}%" > coverage-summary.md
          coverage report --fail-under=75 > /dev/null

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          header: "coverage-${{ matrix.hardware }}"
          path: coverage-summary.md

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage.xml
          flags: ${{ matrix.hardware }}
